
services:
  database:
    image: postgres:14-alpine3.23
    container_name: bookshop-database
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - game_market_network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      target: runtime
    container_name: bookshop-backend
    volumes:
      - ./backend:/app/app
      - ./uploads:/app/uploads
    env_file:
      - ./.env
    entrypoint: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    networks:
      - game_market_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  web-server:
    image: nginx:stable-alpine3.23
    container_name: bookshop-web-server
    networks:
      - game_market_network
    ports:
      - "9000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./uploads:/usr/share/nginx/html/uploads
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:

networks:
  game_market_network: